<style>
:root{
  --bg:#F2F4F1;--surface:#FFFFFF;--ink:#1B2421;--muted:#66726D;--line:#D9DFDA;
  --accent:#1F5C57;--danger:#A93D24;--danger-bg:#F8E4DE;
  --caution:#7A5410;--caution-bg:#F7EBD2;--ok:#2F6B45;--ok-bg:#E1F0E5;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121816;--surface:#1A2320;--ink:#E6ECE9;--muted:#93A29C;--line:#2C3833;
    --accent:#6FB8AF;--danger:#F08A6C;--danger-bg:#3A221B;
    --caution:#E9BE6A;--caution-bg:#3A2F16;--ok:#8ED0A0;--ok-bg:#1C3324;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 48px}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:24px}
h1{font-family:Georgia,"Iowan Old Style",serif;font-weight:600;font-size:30px;margin:0;letter-spacing:-.01em}
.month-nav{display:flex;gap:8px;align-items:center}
input,select,button{font:inherit;color:inherit}
button{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
input,select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.month-nav input{width:auto}
.grid{display:grid;grid-template-columns:320px 1fr;gap:24px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:24px}
.grid > div > .card:last-child{margin-bottom:0}
.card h2{font-size:13px;font-weight:600;margin:0 0 12px;color:var(--muted)}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:12px}
label input,label select{margin-top:4px;display:block}
.budgetline{display:flex;gap:10px;align-items:flex-end}
.budgetline label{margin:0}
.alert{border-radius:10px;padding:14px 16px;margin-bottom:24px;font-weight:500;border:1px solid transparent}
.alert[hidden]{display:none}
.alert.danger{background:var(--danger-bg);color:var(--danger);border-color:var(--danger)}
.alert.caution{background:var(--caution-bg);color:var(--caution);border-color:var(--caution)}
.alert.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
@media (max-width:620px){.stats{grid-template-columns:1fr}}
.stat .l{font-size:13px;color:var(--muted)}
.stat .v{font-family:Georgia,serif;font-size:24px;font-variant-numeric:tabular-nums}
.stat .v.danger{color:var(--danger)}
.meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.meter span{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.meter.over span{background:var(--danger)}
.chart{display:grid;grid-template-columns:220px 1fr;gap:24px;align-items:center}
@media (max-width:620px){.chart{grid-template-columns:1fr}}
.chart svg{width:100%;max-width:220px;height:auto;display:block}
.legend{list-style:none;margin:0;padding:0}
.legend li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.legend .name{display:flex;align-items:center}
.legend .muted{color:var(--muted);font-size:13px;margin-left:6px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;flex:none}
.list{list-style:none;padding:0;margin:0}
.list li{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.list .meta{font-size:13px;color:var(--muted)}
.amt{font-variant-numeric:tabular-nums;font-weight:600}
.del{padding:4px 8px;font-size:13px;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:12px 0}
.empty[hidden]{display:none}
.hint{font-size:13px;color:var(--muted);margin:10px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Monthly budget</h1>
    <div class="month-nav">
      <button id="prev" aria-label="Previous month">&larr;</button>
      <input type="month" id="month" aria-label="Month">
      <button id="next" aria-label="Next month">&rarr;</button>
    </div>
  </header>

  <div id="alert" class="alert" role="status" hidden></div>

  <div class="grid">
    <div>
      <section class="card">
        <h2>Budget for this month</h2>
        <div class="budgetline">
          <label style="flex:1">Total budget
            <input type="number" id="budget" min="0" step="0.01" placeholder="0.00">
          </label>
          <label style="width:84px">Symbol
            <input type="text" id="sym" value="₹" maxlength="4">
          </label>
        </div>
      </section>

      <section class="card">
        <h2>Add expense</h2>
        <div id="form">
          <label>Amount
            <input type="number" id="amount" min="0.01" step="0.01" required>
          </label>
          <label>Category
            <select id="cat"></select>
          </label>
          <label>Note
            <input type="text" id="note" maxlength="80" placeholder="e.g. Weekly groceries">
          </label>
          <label>Date
            <input type="date" id="date" required>
          </label>
          <button class="primary" type="button" id="addBtn" style="width:100%">Add expense</button>
          <p class="hint" id="addMsg" role="status"></p>
        </div>
      </section>
    </div>

    <div>
      <section class="card">
        <div class="stats">
          <div class="stat"><div class="l">Spent</div><div class="v" id="spent">0</div></div>
          <div class="stat"><div class="l">Remaining</div><div class="v" id="left">&mdash;</div></div>
          <div class="stat"><div class="l">Budget used</div><div class="v" id="pct">&mdash;</div></div>
        </div>
        <div class="meter" id="meter"><span></span></div>
      </section>

      <section class="card">
        <h2>Breakdown by category</h2>
        <div class="chart">
          <div id="pie"></div>
          <ul class="legend" id="legend"></ul>
        </div>
      </section>

      <section class="card">
        <h2>Expenses this month</h2>
        <ul class="list" id="list"></ul>
        <div class="empty" id="empty">No expenses yet. Add one on the left.</div>
      </section>
    </div>
  </div>
  <p class="hint">Your entries are saved on this device. Clearing browser data will erase them.</p>
</div>

<script>
const CATS = [
  ["Housing", "#1F5C57"], ["Food", "#C9873B"], ["Transport", "#4B6CB7"],
  ["Utilities", "#8A5A9E"], ["Entertainment", "#6E8B3D"], ["Health", "#B5472B"],
  ["Shopping", "#3E8E9A"], ["Other", "#8C8474"]
];

// Each month is stored under "YYYY-MM" with its own budget and expenses.
const STORAGE_KEY = "monthly-budget-tracker-v1";
const store = {};
let nextId = 1;

function loadSaved() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    if (!saved) return;
    Object.assign(store, saved.months || {});
    if (saved.symbol) $("sym").value = saved.symbol;
    let maxId = 0;
    Object.values(store).forEach(m => m.expenses.forEach(e => { if (e.id > maxId) maxId = e.id; }));
    nextId = maxId + 1;
  } catch (err) {
    console.error("Could not load saved budget data", err);
  }
}

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ months: store, symbol: $("sym").value }));
  } catch (err) {
    console.error("Could not save budget data", err);
  }
}

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const monthKey = d => d.getFullYear() + "-" + pad(d.getMonth() + 1);
let view = monthKey(new Date());
const todayStr = () => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
const data = k => store[k] || (store[k] = { budget: 0, expenses: [] });
const money = n => $("sym").value + Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function syncDate() {
  const [y, m] = view.split("-").map(Number);
  $("date").removeAttribute("min");
  $("date").removeAttribute("max");
  $("date").value = monthKey(new Date()) === view ? todayStr() : view + "-01";
}

function setMonth(k) {
  view = k;
  $("month").value = k;
  $("budget").value = data(k).budget || "";
  syncDate();
  render();
}

function render() {
  const d = data(view);
  const spent = d.expenses.reduce((s, e) => s + e.amount, 0);
  const b = d.budget;
  const over = b > 0 && spent > b;

  // Stats
  $("spent").textContent = money(spent);
  $("spent").classList.toggle("danger", over);
  $("left").textContent = b > 0 ? money(b - spent) : "\u2014";
  $("left").classList.toggle("danger", over);
  $("pct").textContent = b > 0 ? Math.round(spent / b * 100) + "%" : "\u2014";
  $("meter").classList.toggle("over", over);
  $("meter").firstElementChild.style.width = b > 0 ? Math.min(100, spent / b * 100) + "%" : "0";

  // Warning
  const al = $("alert");
  if (!b) {
    al.hidden = true;
  } else {
    al.hidden = false;
    if (over) {
      al.className = "alert danger";
      al.textContent = "Over budget by " + money(spent - b) + ". You've spent " + money(spent) + " of " + money(b) + " this month.";
    } else if (spent >= 0.8 * b) {
      al.className = "alert caution";
      al.textContent = "Heads up: " + Math.round(spent / b * 100) + "% of your budget is used. " + money(b - spent) + " left.";
    } else {
      al.className = "alert ok";
      al.textContent = "On track. " + money(b - spent) + " left this month.";
    }
  }

  // Pie chart and legend
  const totals = CATS.map(([name, color]) => ({
    name, color,
    value: d.expenses.filter(e => e.category === name).reduce((s, e) => s + e.amount, 0)
  })).filter(t => t.value > 0);

  const pie = $("pie");
  const legend = $("legend");
  legend.innerHTML = "";

  if (spent === 0) {
    pie.innerHTML = '<svg viewBox="0 0 200 200" role="img" aria-label="No expenses yet"><circle cx="100" cy="100" r="90" fill="none" stroke="var(--line)" stroke-width="20"/></svg>';
  } else if (totals.length === 1) {
    pie.innerHTML = '<svg viewBox="0 0 200 200" role="img" aria-label="Pie chart"><circle cx="100" cy="100" r="90" fill="' + totals[0].color + '" stroke="var(--surface)" stroke-width="2"/></svg>';
  } else {
    let angle = -Math.PI / 2;
    let paths = "";
    totals.forEach(t => {
      const sweep = t.value / spent * Math.PI * 2;
      const x1 = 100 + 90 * Math.cos(angle), y1 = 100 + 90 * Math.sin(angle);
      angle += sweep;
      const x2 = 100 + 90 * Math.cos(angle), y2 = 100 + 90 * Math.sin(angle);
      const large = sweep > Math.PI ? 1 : 0;
      paths += '<path d="M100 100 L' + x1.toFixed(2) + ' ' + y1.toFixed(2) + ' A90 90 0 ' + large + ' 1 ' + x2.toFixed(2) + ' ' + y2.toFixed(2) + ' Z" fill="' + t.color + '" stroke="var(--surface)" stroke-width="2"/>';
    });
    pie.innerHTML = '<svg viewBox="0 0 200 200" role="img" aria-label="Pie chart of spending by category">' + paths + '</svg>';
  }

  totals.forEach(t => {
    const li = document.createElement("li");
    const name = document.createElement("span");
    name.className = "name";
    const sw = document.createElement("span");
    sw.className = "sw";
    sw.style.background = t.color;
    name.appendChild(sw);
    name.appendChild(document.createTextNode(t.name));
    const pct = document.createElement("span");
    pct.className = "muted";
    pct.textContent = Math.round(t.value / spent * 100) + "%";
    name.appendChild(pct);
    const val = document.createElement("span");
    val.textContent = money(t.value);
    li.appendChild(name);
    li.appendChild(val);
    legend.appendChild(li);
  });

  // Expense list, newest first
  const list = $("list");
  list.innerHTML = "";
  const sorted = d.expenses.slice().sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
  sorted.forEach(e => {
    const li = document.createElement("li");
    const left = document.createElement("div");
    const title = document.createElement("div");
    title.textContent = e.note || e.category;
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = e.date + " \u00b7 " + e.category;
    left.appendChild(title);
    left.appendChild(meta);
    const amt = document.createElement("span");
    amt.className = "amt";
    amt.textContent = money(e.amount);
    const del = document.createElement("button");
    del.className = "del";
    del.textContent = "Remove";
    del.setAttribute("aria-label", "Remove expense " + (e.note || e.category));
    del.addEventListener("click", () => {
      data(view).expenses = data(view).expenses.filter(x => x.id !== e.id);
      render();
    });
    li.appendChild(left);
    li.appendChild(amt);
    li.appendChild(del);
    list.appendChild(li);
  });
  $("empty").hidden = sorted.length > 0;
  saveData();
}

// Wire up controls
const catSel = $("cat");
CATS.forEach(([name]) => {
  const o = document.createElement("option");
  o.value = name;
  o.textContent = name;
  catSel.appendChild(o);
});

$("prev").addEventListener("click", () => {
  const [y, m] = view.split("-").map(Number);
  setMonth(monthKey(new Date(y, m - 2, 1)));
});
$("next").addEventListener("click", () => {
  const [y, m] = view.split("-").map(Number);
  setMonth(monthKey(new Date(y, m, 1)));
});
$("month").addEventListener("change", e => { if (e.target.value) setMonth(e.target.value); });
$("budget").addEventListener("input", () => {
  data(view).budget = Math.max(0, parseFloat($("budget").value) || 0);
  render();
});
$("sym").addEventListener("input", render);

function addExpense() {
  const amt = parseFloat($("amount").value);
  if (!(amt > 0)) {
    $("addMsg").textContent = "Enter an amount greater than zero.";
    $("amount").focus();
    return;
  }
  const date = $("date").value || todayStr();
  const k = date.slice(0, 7);
  data(k).expenses.push({
    id: nextId++,
    amount: Math.round(amt * 100) / 100,
    category: catSel.value,
    note: $("note").value.trim(),
    date: date
  });
  $("amount").value = "";
  $("note").value = "";
  if (k !== view) {
    setMonth(k);
  } else {
    render();
  }
  $("addMsg").textContent = "Added " + money(amt) + " to " + k + ".";
  $("amount").focus();
}
$("addBtn").addEventListener("click", addExpense);
["amount", "note"].forEach(id => $(id).addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); addExpense(); }
}));

loadSaved();
setMonth(view);
</script>
</body>
</html>
